
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="950"
     viewBox="0 0 1400 950"
     role="img"
     aria-label="Animated SQL investigation with vehicle surveillance and character-by-character SQL typing">

<title>SQL Data Breach Investigation — Surveillance Analysis</title>

<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1014"/>
    <stop offset=".55" stop-color="#182128"/>
    <stop offset="1" stop-color="#0b1218"/>
  </linearGradient>

  <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#263139"/>
    <stop offset="1" stop-color="#151e25"/>
  </linearGradient>

  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#303940"/>
    <stop offset="1" stop-color="#101820"/>
  </linearGradient>

  <linearGradient id="vehicle" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#798b96"/>
    <stop offset=".45" stop-color="#354752"/>
    <stop offset="1" stop-color="#17252f"/>
  </linearGradient>

  <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a7ffbf" stop-opacity=".28"/>
    <stop offset="1" stop-color="#79ffac" stop-opacity=".02"/>
  </linearGradient>

  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d78940"/>
    <stop offset="1" stop-color="#ffd49b"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40"
           patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
          fill="none" stroke="#82919c"
          stroke-width=".6" opacity=".12"/>
  </pattern>

  <clipPath id="streetClip">
    <rect x="42" y="337" width="807" height="300" rx="10"/>
  </clipPath>

  <!-- Typing masks: 18-second synchronized loop -->
  <mask id="type1" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="370" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;135;135;0"
               keyTimes="0;.13;.94;1"
               calcMode="discrete"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <mask id="type2" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="399" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;0;0;0"
               dur="18s" repeatCount="indefinite"/>
      <animate attributeName="width"
               values="0;0;210;210;0"
               keyTimes="0;.14;.29;.94;1"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <mask id="type3" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="428" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;0;230;230;0"
               keyTimes="0;.30;.45;.94;1"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <mask id="type4" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="457" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;0;175;175;0"
               keyTimes="0;.46;.59;.94;1"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <mask id="type5" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="486" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;0;215;215;0"
               keyTimes="0;.60;.75;.94;1"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <mask id="type6" maskContentUnits="userSpaceOnUse">
    <rect x="920" y="515" width="0" height="24" fill="white">
      <animate attributeName="width"
               values="0;0;365;365;0"
               keyTimes="0;.76;.91;.94;1"
               dur="18s" repeatCount="indefinite"/>
    </rect>
  </mask>

  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .heading {fill:#f5f5f0;font-weight:bold}
    .muted {fill:#aab8bc}
    .panel {fill:url(#surface);stroke:#56656b;stroke-width:1.5}
    .mono {font-family:Consolas,Monaco,monospace}
  </style>

  <g id="trackedCar">
    <ellipse cx="0" cy="38" rx="110" ry="11"
             fill="#02070a" opacity=".6"/>

    <path d="M-112 7L-94-16L-54-23L-31-54
             Q-21-65 5-65H50Q70-65 86-42
             L105-18Q118-12 119 6V24H-112Z"
          fill="url(#vehicle)"
          stroke="#a5b6bf" stroke-width="2"/>

    <path d="M-42-26L-20-54H7V-26Z"
          fill="#0a1c27" stroke="#7b9aa7" stroke-width="1.5"/>

    <path d="M16-54H48Q60-54 74-30L77-26H16Z"
          fill="#0a1c27" stroke="#7b9aa7" stroke-width="1.5"/>

    <path d="M-15-51L-33-29M30-51L49-29"
          stroke="#c2d8dc" opacity=".3" stroke-width="3"/>

    <path d="M11-24V18M-43-23L-44 18"
          fill="none" stroke="#82939c" stroke-width="1.5"/>

    <path d="M-30-14H-13M30-14H47"
          stroke="#c0ccd0" stroke-width="3"
          stroke-linecap="round"/>

    <rect x="103" y="-9" width="14" height="9"
          rx="2" fill="#f6e9ba"/>

    <rect x="-112" y="-5" width="12" height="10"
          rx="2" fill="#d7504b"/>

    <circle cx="-67" cy="23" r="25"
            fill="#0a0f14" stroke="#55636c" stroke-width="3"/>
    <circle cx="70" cy="23" r="25"
            fill="#0a0f14" stroke="#55636c" stroke-width="3"/>

    <circle cx="-67" cy="23" r="12" fill="#8797a0"/>
    <circle cx="70" cy="23" r="12" fill="#8797a0"/>

    <g stroke="#263641" stroke-width="3">
      <path d="M-67 11V35M-79 23H-55"/>
      <path d="M70 11V35M58 23H82"/>
    </g>
  </g>
</defs>

