<!-- SQL CODE WITH CHARACTER-BY-CHARACTER REVEAL -->
<!-- A blue cursor moves across each line in sequence. -->

<g class="mono" font-size="15">

  <text x="920" y="390" fill="#e9b47d"
        mask="url(#type1)">
    SELECT DISTINCT
  </text>

  <text x="920" y="419" fill="#d9e6e3"
        mask="url(#type2)">
    vehicle_id, driver_id,
  </text>

  <text x="920" y="448" fill="#d9e6e3"
        mask="url(#type3)">
    rider_id, employee_name
  </text>

  <text x="920" y="477" fill="#e9b47d"
        mask="url(#type4)">
    FROM ride_records
  </text>

  <text x="920" y="506" fill="#8ce2ae"
        mask="url(#type5)">
    JOIN employee_records
  </text>

  <text x="920" y="535" fill="#d9e6e3"
        mask="url(#type6)">
    ON rider_name = employee_name;
  </text>

</g>

